# 测试用的 @HttpExchange 分组（base-url 在启动时就要能解析）
# down：端口 1 上没有服务，连接必被拒绝 → 用来验证"下游连不上"
spring.http.serviceclient.down.base-url=http://localhost:1
# lb / ghost：Spring Cloud 官方的按服务名写法 lb://服务名，实例来自静态实例列表（见 LoadBalancedGroupTest）
spring.http.serviceclient.lb.base-url=lb://wallet
spring.http.serviceclient.ghost.base-url=lb://ghost
