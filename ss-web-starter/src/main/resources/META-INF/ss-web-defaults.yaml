# ss-web-starter 默认配置（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（graceful 停机、健康探针、springdoc 路径）不重复配置
server:
  # 容器只信任内网代理的 X-Forwarded-*，据此还原真实客户端地址（见 WebUtils#getRemoteIp）
  forward-headers-strategy: native
spring:
  threads:
    virtual:
      # JDK 21+ 的 Servlet 应用推荐使用虚拟线程；个别服务（如低延迟场景）可设为 false 关闭
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 30s
  jackson:
    # 容错：JSON 中有 Bean 没有的属性不报错
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    # @RequestParam / @PathVariable 的时间类型统一按 ISO-8601 绑定
    format:
      date: iso
      date-time: iso
      time: iso
management:
  tracing:
    sampling:
      # 开发/测试环境全量采样；prod 默认 0.1（见 SsWebEnvironmentPostProcessor）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
