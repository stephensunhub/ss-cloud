# ss-web-starter 默认配置（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（graceful 停机、健康探针、springdoc 路径）不重复配置
server:
  # 容器只信任内网代理的 X-Forwarded-*，据此还原真实客户端地址（见 WebUtils#getRemoteIp）
  forward-headers-strategy: native
spring:
  threads:
    virtual:
      # JDK 21+ 的 Servlet 应用推荐使用虚拟线程；个别服务（如低延迟场景）可设为 false 关闭
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cache:
    redis:
      # @Cacheable 缓存项的默认过期时间（Boot 默认永不过期，忘了配置的缓存会一直占着 Redis）；
      # 个别缓存项要不同的时间，注册 CacheTtlResolver Bean
      time-to-live: 30m
  task:
    execution:
      # @Async 等异步任务里的日志和链路带上调用方的 traceId（Boot 默认关闭）
      propagate-context: true
      shutdown:
        # 停机时等待进行中的异步任务（Boot 默认不等待），时长与上面的 timeout-per-shutdown-phase 一致
        await-termination: true
        await-termination-period: 30s
      # 以下两组只在关闭虚拟线程（spring.threads.virtual.enabled=false）时生效，数值只是起点，按负载调整。
      # Boot 的默认值是"最大线程数和队列都不设上限"，实际只有 8 个核心线程加无界队列，过载时不拒绝、只堆积
      pool:
        max-size: 64
        queue-capacity: 200
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
      pool:
        # Boot 默认 1：一个慢任务会堵住所有 @Scheduled
        size: 4
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 30s
  jackson:
    # 容错：JSON 中有 Bean 没有的属性不报错
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    # @RequestParam / @PathVariable 的时间类型统一按 ISO-8601 绑定
    format:
      date: iso
      date-time: iso
      time: iso
management:
  tracing:
    sampling:
      # 开发/测试环境全量采样；prod 默认 0.1（见 SsWebEnvironmentPostProcessor）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # 所有指标带上服务名，便于在 Prometheus 里按服务过滤（与 gRPC starter 一致）
      application: ${spring.application.name:application}
    distribution:
      # HTTP 耗时默认只有 count/sum/max，配上固定的桶后才能跨实例聚合出 p95/p99（与 gRPC starter 一致）。
      # 只取 11 个桶，而不是 percentiles-histogram 的 60 多个：接口 × 状态 × 方法的组合多时，时间序列数量差 5 倍以上
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        http.client.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
