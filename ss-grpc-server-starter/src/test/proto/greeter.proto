syntax = "proto3";

package ss.grpc.test;

option java_multiple_files = true;
option java_package = "men.sbb8.grpc.starter.test";
option java_outer_classname = "GreeterProto";

service Greeter {
  rpc Hello(HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
