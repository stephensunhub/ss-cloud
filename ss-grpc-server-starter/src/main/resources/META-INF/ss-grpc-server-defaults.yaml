# ss-grpc-server-starter 默认配置（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（gRPC 优雅停机 30s、健康检查）不重复配置
spring:
  grpc:
    server:
      port: 9001
      keepalive:
        connection:
          # 连接最长存活时间，到期后服务端优雅地关闭它（GOAWAY，给 grace-period 的时间让进行中的请求完成），客户端随之重新解析地址并重连。
          # k8s 用 headless Service 做服务发现时这是必须的：gRPC 的 DNS 解析只在连接断开时才重新查询，
          # 不设的话（Boot 默认无限），新扩容的 pod 要等到有连接因故障断开才会被客户端发现，一直没有流量。
          # 超过这个时间的长连接流式调用会在 max-age + grace-period（Boot 默认 30s）后被取消，
          # 长时间订阅类的服务请调大或客户端做好重新订阅。与 Boot 默认值相同的 grace-period 不重复配置
          max-age: 10m
      health:
        # k8s gRPC 探针按服务名探测 grpc.health.v1：
        #   存活 service: liveness   就绪 service: readiness   service 留空表示整体健康
        # 与 Boot HTTP 探针一致：存活只看进程自身状态，不带外部依赖；就绪看是否接收流量（含优雅停机），
        # 应用需要把依赖（数据库等）纳入就绪时，追加 include，名称是 actuator 健康贡献者名
        service:
          liveness:
            include: livenessState
          readiness:
            include: readinessState
