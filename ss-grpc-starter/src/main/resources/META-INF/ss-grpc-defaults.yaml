# ss-grpc-starter 默认配置（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（gRPC 优雅停机 30s、健康检查、观测指标）不重复配置
# 不配置 spring.threads.virtual.enabled：Boot 的 gRPC 服务端不读取它，配了也不生效
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  grpc:
    server:
      port: 9001
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
