# ss-grpc-starter 默认配置（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（gRPC 优雅停机 30s、健康检查、观测指标）不重复配置
# 不配置 spring.threads.virtual.enabled：Boot 的 gRPC 服务端不读取它，配了也不生效
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  grpc:
    server:
      port: 9001
      health:
        # k8s gRPC 探针按服务名探测 grpc.health.v1：
        #   存活 service: liveness   就绪 service: readiness   service 留空表示整体健康
        # 与 Boot HTTP 探针一致：存活只看进程自身状态，不带外部依赖；就绪看是否接收流量（含优雅停机），
        # 应用需要把依赖（数据库等）纳入就绪时，追加 include，名称是 actuator 健康贡献者名
        service:
          liveness:
            include: livenessState
          readiness:
            include: readinessState
