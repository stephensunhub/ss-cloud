# ss-grpc-core 默认配置，服务端、客户端共用（最低优先级，应用配置可覆盖）
# 与 Spring Boot 默认值相同的项（观测指标等）不重复配置
# 不配置 spring.threads.virtual.enabled：Boot 的 gRPC 服务端不读取它，配了也不生效
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  tracing:
    sampling:
      # 开发/测试环境全量采样；prod 默认 0.1（见 SsGrpcEnvironmentPostProcessor）
      probability: 1.0
  metrics:
    tags:
      # 所有指标带上服务名，便于在 Prometheus 里按服务过滤
      application: ${spring.application.name:application}
    distribution:
      # gRPC 耗时默认只有 count/sum/max，开启直方图后才能跨实例聚合出 p95/p99
      percentiles-histogram:
        grpc.server: true
        grpc.client: true
      # 限定桶的范围，控制时间序列数量
      minimum-expected-value:
        grpc.server: 1ms
        grpc.client: 1ms
      maximum-expected-value:
        grpc.server: 10s
        grpc.client: 10s
